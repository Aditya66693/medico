server.port=${PORT:8080}
server.error.include-message=always
# Local default = H2 file DB. In production set DB_URL (jdbc:postgresql://...), DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/medico}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

medico.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
medico.jwt-hours=24
medico.cors-origins=${CORS_ORIGINS:http://localhost:5173}
# dev-mode=true lets you review an appointment immediately (for testing). Set DEV_MODE=false in prod.
medico.dev-mode=${DEV_MODE:true}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Demo payments (fake 'paid', no money) only when DEMO_PAYMENTS=true; defaults to DEV_MODE. Prod: leave false.
medico.demo-payments=${DEMO_PAYMENTS:${DEV_MODE:true}}
# Leave blank to use demo payment mode. Use Razorpay TEST keys (rzp_test_...) to try real checkout.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# First admin account. In dev-mode with these blank, admin@medico.local / admin123 is created.
medico.admin-email=${ADMIN_EMAIL:}
medico.admin-password=${ADMIN_PASSWORD:}
# Set SEED_SAMPLE=false in prod to skip the fictional sample doctors.
medico.seed-sample=${SEED_SAMPLE:true}
